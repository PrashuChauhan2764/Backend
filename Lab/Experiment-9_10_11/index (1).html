<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Student Directory</h1>

        <button id="loadJson">Load JSON Students</button>
        <button id="loadXml">Load XML Students</button>

        <p id="status" role="status">Select an option to load student data.</p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                <!-- JavaScript inserts student records here. -->
            </tbody>
        </table>
    </main>

    <!-- Load jQuery before application code that uses $. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
