<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Responsive Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .card {
            flex: 1;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            line-height: 1.6;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>My Responsive Page</h1>
    </div>

    <div class="container">
        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </div>
    </div>
</body>
</html>
