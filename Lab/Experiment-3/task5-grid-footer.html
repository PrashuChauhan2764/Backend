<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Responsive Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background-color: #222;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        .header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            line-height: 1.6;
            color: #666;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 1.2rem;
            }

            nav ul {
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
                gap: 10px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MySite</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="header">
        <h1>My Responsive Page</h1>
        <p>Resize the browser window to see the layout change.</p>
    </div>

    <div class="container">
        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card in the grid.</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card in the grid.</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card in the grid.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 My Responsive Page</p>
    </footer>
</body>
</html>
